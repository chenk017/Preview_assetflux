name: Dapatkan Lisensi Unity
on: workflow_dispatch # Tombol jalankan manual di web GitHub
jobs:
  activation:
    name: Request (.alf) File
    runs-on: ubuntu-latest
    steps:
      - name: Request Activation File
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityEmail: ${{ secrets.UNITY_EMAIL }}
          unityPassword: ${{ secrets.UNITY_PASSWORD }}
      - name: Upload (.alf) File
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_File
          path: ./*.alf
